services:
  isaac:
    image: "arena_isaac:${ARENA_IMAGE_TAG}"
    pull_policy: "never"
    build:
      context: .
      dockerfile: src/Arena/_meta/docker/features/isaac/Dockerfile
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "shared:/tmp/shared"
      - "$HOST_ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$HOST_ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$HOST_ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$HOST_ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$HOST_ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$HOST_ARENA_WS_DIR/.env:/opt/arena_ws/.env"
    environment:
      - DISPLAY
      - TMPDIR=/tmp/shared
      - QT_X11_NO_MITSHM=1
      - UV_LINK_MODE=copy
      - ARENA_IMAGE
      - ARENA_IMAGE_TAG
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - HOST_UID
      - HOST_ARENA_WS_DIR
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      - LLM_API_ENDPOINT
    env_file:
      - .env
    stdin_open: true
    tty: true
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
